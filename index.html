<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI-Recorder">
<title>AI-Recorder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141318;
    --surface:#1D1B22;
    --surface-hi:#26232C;
    --text:#F2F0EC;
    --text-muted:#87838F;
    --accent:#FF3D8A;
    --divider:#2A2731;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif;overscroll-behavior:none;height:100%;}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    display:flex;flex-direction:column;min-height:100vh;}
  .mono{font-family:'Space Mono',monospace;}
  ::selection{background:var(--accent);color:#fff;}
  button,input{font-family:inherit;}

  header{padding:20px 20px 4px;display:flex;align-items:baseline;justify-content:space-between;}
  header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-0.02em;}
  header .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

  .install-banner{margin:10px 20px 0;padding:9px 12px;background:var(--surface);
    border-radius:10px;font-size:11.5px;color:var(--text-muted);
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .install-banner button{background:none;border:none;color:var(--text-muted);font-size:15px;
    cursor:pointer;padding:0 2px;line-height:1;}

  .recorder{padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .waveform{width:100%;max-width:320px;height:44px;display:block;}
  .counter{font-size:30px;font-weight:700;letter-spacing:0.03em;color:var(--text);
    display:flex;align-items:center;gap:8px;}
  .rec-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);
    animation:blink 1s ease-in-out infinite;opacity:0;}
  .rec-dot.on{opacity:1;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .rec-btn{width:76px;height:76px;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);position:relative;display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;margin-top:4px;}
  .rec-btn:active{transform:scale(0.93);}
  .rec-btn .core{width:24px;height:24px;border-radius:8px;background:#fff;transition:all .2s ease;}
  .rec-btn.recording{animation:pulse 1.6s ease-out infinite;}
  .rec-btn.recording .core{border-radius:6px;width:22px;height:22px;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,61,138,0.45);}
    70%{box-shadow:0 0 0 15px rgba(255,61,138,0);}
    100%{box-shadow:0 0 0 0 rgba(255,61,138,0);}
  }
  .live-transcript{width:100%;max-width:320px;min-height:16px;max-height:64px;overflow-y:auto;
    font-size:12.5px;color:var(--text-muted);text-align:center;line-height:1.5;padding:0 6px;}
  .live-transcript .final{color:var(--text);}

  .folders-row{display:flex;align-items:center;gap:8px;padding:2px 20px 12px;}
  .folders{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
  .folders::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:6px 12px 6px 10px;border-radius:20px;background:var(--surface);
    font-size:12.5px;color:var(--text-muted);cursor:pointer;white-space:nowrap;font-weight:500;
    display:flex;align-items:center;gap:6px;transition:background .15s ease,color .15s ease;}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .chip.active{color:var(--text);}
  .chip .count{opacity:0.55;}
  .manage-btn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface);
    border:none;color:var(--text-muted);font-size:14px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;}

  main{flex:1;padding:0 20px 24px;}
  .empty{text-align:center;color:var(--text-muted);font-size:13px;padding:56px 24px;line-height:1.6;}
  .entry{background:var(--surface);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;}
  .entry-title{font-size:14px;font-weight:600;line-height:1.35;}
  .entry-meta{display:flex;gap:7px;align-items:center;margin-top:5px;}
  .entry-meta .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .entry-meta .folder-name{font-size:11px;color:var(--text-muted);font-weight:600;}
  .entry-meta .time{font-size:11px;color:var(--text-muted);}
  .entry-meta .sep{color:var(--divider);font-size:10px;}
  .entry-summary{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .analyzing{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-top:4px;}
  .spinner{width:11px;height:11px;border:2px solid var(--divider);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:10;
    opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);z-index:11;
    border-radius:20px 20px 0 0;padding:16px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:84vh;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:34px;height:4px;background:var(--divider);border-radius:2px;margin:0 auto 16px;}
  .sheet h2{font-size:18px;margin:0 0 8px;font-weight:700;line-height:1.3;}
  .sheet .meta-row{display:flex;gap:7px;align-items:center;margin-bottom:14px;}
  .sheet audio{width:100%;margin-bottom:14px;height:34px;}
  .block-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--text-muted);font-weight:700;margin:16px 0 7px;}
  .summary-text{font-size:13.5px;line-height:1.6;color:var(--text);}
  .keypoints{margin:0;padding:0;list-style:none;}
  .keypoints li{font-size:13px;line-height:1.5;color:var(--text);padding-left:16px;
    position:relative;margin-bottom:6px;}
  .keypoints li:before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;
    border-radius:50%;background:var(--accent);}
  .conclusion-text{font-size:13px;line-height:1.55;color:var(--text);background:var(--surface-hi);
    padding:11px 13px;border-radius:10px;}
  .transcript-text{font-size:12.5px;line-height:1.65;color:var(--text-muted);white-space:pre-wrap;}
  .delete-btn{margin-top:22px;width:100%;padding:12px;border-radius:12px;border:none;
    background:var(--surface-hi);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;}

  /* Folder manager */
  .fm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider);}
  .fm-row:last-of-type{border-bottom:none;}
  .fm-dot{width:20px;height:20px;border-radius:50%;flex:0 0 auto;border:none;cursor:pointer;}
  .fm-input{flex:1;min-width:0;background:none;border:none;color:var(--text);font-size:14px;
    font-weight:500;padding:6px 0;border-bottom:1px solid transparent;}
  .fm-input:focus{outline:none;border-bottom:1px solid var(--accent);}
  .fm-del{flex:0 0 auto;background:none;border:none;color:var(--text-muted);font-size:16px;
    cursor:pointer;padding:4px 6px;}
  .fm-add{margin-top:14px;width:100%;padding:11px;border-radius:12px;border:1px dashed var(--divider);
    background:none;color:var(--text-muted);font-size:13px;cursor:pointer;}
  .fm-hint{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.5;}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);background:var(--surface-hi);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:12.5px;opacity:0;
    transition:all .25s ease;z-index:20;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div>
    <h1>AI-Recorder</h1>
    <div class="sub">запись · ИИ-конспект · папки</div>
  </div>
</header>

<div class="install-banner" id="installBanner">
  <span>Safari → «Поделиться» → «На экран Домой» — чтобы работало как приложение</span>
  <button id="dismissBanner">✕</button>
</div>

<div class="recorder">
  <canvas class="waveform" id="waveform"></canvas>
  <div class="counter mono"><span class="rec-dot" id="recDot"></span><span id="counterText">00:00</span></div>
  <button class="rec-btn" id="recBtn"><div class="core" id="recCore"></div></button>
  <div class="live-transcript mono" id="liveTranscript"></div>
</div>

<div class="folders-row">
  <div class="folders" id="folders"></div>
  <button class="manage-btn" id="manageBtn" title="Управлять папками">✎</button>
</div>

<main id="main"></main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const PALETTE = ['#5B8DEF','#4FBDBA','#E8A23D','#9B7EDE','#52B788','#EF767A','#7C8798','#D4A64A'];

  const els = {
    recBtn: document.getElementById('recBtn'),
    recDot: document.getElementById('recDot'),
    counterText: document.getElementById('counterText'),
    liveTranscript: document.getElementById('liveTranscript'),
    waveform: document.getElementById('waveform'),
    folders: document.getElementById('folders'),
    manageBtn: document.getElementById('manageBtn'),
    main: document.getElementById('main'),
    overlay: document.getElementById('overlay'),
    sheet: document.getElementById('sheet'),
    sheetContent: document.getElementById('sheetContent'),
    toast: document.getElementById('toast'),
    installBanner: document.getElementById('installBanner'),
    dismissBanner: document.getElementById('dismissBanner'),
  };

  let state = { entries: [], folders: [] };
  let activeFolder = 'Все';
  let isRecording = false;
  let mediaRecorder, audioChunks = [], recognition, recognitionShouldRun = false;
  let finalTranscript = '', interimTranscript = '';
  let audioCtx, analyser, sourceNode, rafId, canvasCtx;
  let startTime, timerInterval, currentStream;

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    setTimeout(()=>els.toast.classList.remove('show'), 2200);
  }
  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML;
  }
  function nextColor(){ return PALETTE[state.folders.length % PALETTE.length]; }
  function getFolder(name){ return state.folders.find(f=>f.name===name); }
  function ensureFolder(name){
    let f = getFolder(name);
    if(!f){ f = {name, color: nextColor()}; state.folders.push(f); }
    return f;
  }

  // ---------- Storage ----------
  async function loadState(){
    try{
      const res = await window.storage.get('app-data');
      if(res && res.value){
        const loaded = JSON.parse(res.value);
        loaded.folders = (loaded.folders||[]).map((f,i)=> typeof f === 'string' ? {name:f, color:PALETTE[i%PALETTE.length]} : f);
        state = loaded;
      }
    }catch(e){}
    try{
      const banner = await window.storage.get('banner-dismissed');
      if(banner && banner.value === 'true'){ els.installBanner.style.display='none'; }
    }catch(e){}
    render();
  }
  async function saveState(){
    try{ await window.storage.set('app-data', JSON.stringify(state)); }
    catch(e){ showToast('Не удалось сохранить данные'); }
  }
  els.dismissBanner.onclick = async ()=>{
    els.installBanner.style.display='none';
    try{ await window.storage.set('banner-dismissed','true'); }catch(e){}
  };

  // ---------- Waveform ----------
  function setupCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const rect = els.waveform.getBoundingClientRect();
    els.waveform.width = rect.width * dpr;
    els.waveform.height = rect.height * dpr;
    canvasCtx = els.waveform.getContext('2d');
    canvasCtx.scale(dpr, dpr);
  }
  function drawIdle(){
    if(!canvasCtx) return;
    const w = els.waveform.getBoundingClientRect().width, h = els.waveform.getBoundingClientRect().height;
    canvasCtx.clearRect(0,0,w,h);
    canvasCtx.fillStyle = '#2A2731';
    const bars = 36, gap = 4, bw = (w - gap*(bars-1))/bars;
    for(let i=0;i<bars;i++){ canvasCtx.fillRect(i*(bw+gap), h/2-1.5, bw, 3); }
  }
  function drawFrame(){
    if(!analyser) return;
    const w = els.waveform.getBoundingClientRect().width, h = els.waveform.getBoundingClientRect().height;
    const bufferLength = analyser.frequencyBinCount;
    const data = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(data);
    canvasCtx.clearRect(0,0,w,h);
    const bars = 36, gap = 4, bw = (w - gap*(bars-1))/bars;
    const step = Math.floor(bufferLength / bars);
    for(let i=0;i<bars;i++){
      let sum=0;
      for(let j=0;j<step;j++){ sum += data[i*step+j] || 0; }
      const avg = sum/step;
      const bh = Math.max(3, (avg/255)*h);
      canvasCtx.fillStyle = '#FF3D8A';
      canvasCtx.fillRect(i*(bw+gap), h/2-bh/2, bw, bh);
    }
    rafId = requestAnimationFrame(drawFrame);
  }

  function fmtTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m+':'+s;
  }
  function startTimer(){
    startTime = Date.now();
    timerInterval = setInterval(()=>{ els.counterText.textContent = fmtTime((Date.now()-startTime)/1000); }, 500);
  }
  function stopTimer(){ clearInterval(timerInterval); }

  // ---------- Speech recognition ----------
  function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ return null; }
    const r = new SR();
    r.lang = 'ru-RU'; r.continuous = true; r.interimResults = true;
    r.onresult = (e)=>{
      interimTranscript = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal){ finalTranscript += t + ' '; } else { interimTranscript += t; }
      }
      updateLiveTranscript();
    };
    r.onerror = ()=>{};
    r.onend = ()=>{ if(recognitionShouldRun){ try{ r.start(); }catch(e){} } };
    return r;
  }
  function updateLiveTranscript(){
    els.liveTranscript.innerHTML =
      '<span class="final">'+escapeHtml(finalTranscript)+'</span><span>'+escapeHtml(interimTranscript)+'</span>';
    els.liveTranscript.scrollTop = els.liveTranscript.scrollHeight;
  }

  // ---------- Recording ----------
  els.recBtn.onclick = async ()=>{ if(isRecording){ stopRecording(); } else { await startRecording(); } };

  async function startRecording(){
    try{ currentStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ showToast('Нет доступа к микрофону'); return; }

    isRecording = true;
    finalTranscript = ''; interimTranscript = ''; audioChunks = [];
    els.liveTranscript.innerHTML = '';
    els.recBtn.classList.add('recording');
    els.recDot.classList.add('on');
    startTimer();

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    sourceNode = audioCtx.createMediaStreamSource(currentStream);
    sourceNode.connect(analyser);
    drawFrame();

    const candidates = ['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    let mimeType;
    for(const c of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(c)){ mimeType=c; break; } }
    mediaRecorder = mimeType ? new MediaRecorder(currentStream,{mimeType}) : new MediaRecorder(currentStream);
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.start();

    recognition = setupRecognition();
    if(recognition){ recognitionShouldRun = true; try{ recognition.start(); }catch(e){} }
    else{ els.liveTranscript.textContent = 'Живая расшифровка не поддерживается — откройте в Safari на iPhone.'; }
  }

  function stopRecording(){
    isRecording = false;
    els.recBtn.classList.remove('recording');
    els.recDot.classList.remove('on');
    stopTimer();
    recognitionShouldRun = false;
    if(recognition){ try{ recognition.stop(); }catch(e){} }
    if(rafId) cancelAnimationFrame(rafId);
    drawIdle();
    if(sourceNode) sourceNode.disconnect();
    if(audioCtx) audioCtx.close();

    const durationSec = (Date.now()-startTime)/1000;
    const transcript = (finalTranscript+' '+interimTranscript).trim();

    mediaRecorder.onstop = async ()=>{
      currentStream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      let audioBase64 = null;
      if(blob.size < 3_500_000){ audioBase64 = await blobToBase64(blob); }
      await handleFinishedRecording(transcript, durationSec, audioBase64, mediaRecorder.mimeType||'audio/webm');
      els.counterText.textContent = '00:00';
      els.liveTranscript.innerHTML = '';
    };
    mediaRecorder.stop();
  }

  function blobToBase64(blob){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  // ---------- AI analysis + save ----------
  async function handleFinishedRecording(transcript, durationSec, audioBase64, mimeType){
    const id = 'e_'+Date.now();
    const provisional = {
      id, createdAt: Date.now(), durationSec,
      transcript: transcript || '', audioBase64, mimeType,
      folder: null, title: transcript ? transcript.slice(0,40) : 'Новая запись',
      summary: null, keyPoints: [], conclusion: null, analyzing: true
    };
    state.entries.unshift(provisional);
    render(); await saveState();

    if(!transcript){
      const f = ensureFolder('Без текста');
      provisional.analyzing = false; provisional.folder = f.name; provisional.title = 'Запись без расшифровки';
      render(); await saveState(); return;
    }

    try{
      const result = await analyze(transcript, state.folders.map(f=>f.name));
      const f = ensureFolder(result.folder);
      provisional.folder = f.name;
      provisional.title = result.title;
      provisional.summary = result.summary || transcript.slice(0,160);
      provisional.keyPoints = (Array.isArray(result.keyPoints) && result.keyPoints.length)
        ? result.keyPoints
        : transcript.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>3).slice(0,4);
      provisional.conclusion = result.conclusion || 'ИИ не выделил отдельный вывод для этой записи — см. конспект выше.';
    }catch(e){
      const f = ensureFolder('Разное');
      provisional.folder = f.name; provisional.title = transcript.slice(0,40);
      showToast('Не удалось выполнить анализ — сохранено в «Разное»');
    }
    provisional.analyzing = false;
    render(); await saveState();
  }

  async function analyze(transcript, existingFolders){
    const prompt = `Ты анализируешь расшифровку голосовой заметки и готовишь из неё структурированный конспект, а также подбираешь папку.
Существующие папки: ${JSON.stringify(existingFolders)}.
Выбери подходящую папку из существующих, если она хорошо соответствует теме, иначе придумай новую короткую папку (1-2 слова на русском).

Ответь СТРОГО в формате JSON без пояснений и без markdown-разметки. Пример правильного ответа для другой записи:
{
  "folder": "Работа",
  "title": "Обсуждение сроков запуска проекта",
  "summary": "Команда обсудила перенос запуска на две недели из-за задержки поставщика и договорилась о новом плане тестирования.",
  "keyPoints": ["Запуск переносится с 10 на 24 число", "Причина — задержка поставки комплектующих", "Тестирование начнётся на неделю раньше, параллельно с доработкой", "Ответственный за коммуникацию с поставщиком — Игорь"],
  "conclusion": "Нужно на этой неделе подтвердить новую дату с клиентом и обновить дорожную карту."
}

Обязательно верни ВСЕ пять полей и никогда не оставляй keyPoints пустым массивом или conclusion пустой строкой — даже для короткой или сумбурной записи выдели то, что реально прозвучало, и сформулируй вывод из этого. Не пропускай поля.

Теперь проанализируй эту расшифровку:
"""${transcript}"""`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    const text = data.content.map(b=>b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!parsed.folder || !parsed.title) throw new Error('bad shape');
    return parsed;
  }

  // ---------- Rendering ----------
  function timeAgo(ts){
    const diff = (Date.now()-ts)/1000;
    if(diff < 60) return 'только что';
    if(diff < 3600) return Math.floor(diff/60)+' мин назад';
    if(diff < 86400) return Math.floor(diff/3600)+' ч назад';
    return Math.floor(diff/86400)+' дн назад';
  }

  function render(){ renderFolders(); renderEntries(); }

  function renderFolders(){
    const counts = {};
    state.entries.forEach(e=>{ if(e.folder){ counts[e.folder] = (counts[e.folder]||0)+1; } });
    let html = `<div class="chip ${activeFolder==='Все'?'active':''}" data-folder="Все">Все <span class="count">${state.entries.length}</span></div>`;
    state.folders.forEach(f=>{
      html += `<div class="chip ${activeFolder===f.name?'active':''}" data-folder="${escapeHtml(f.name)}"
        style="${activeFolder===f.name?`background:${f.color}2E;color:${f.color}`:''}">
        <span class="dot" style="background:${f.color}"></span>${escapeHtml(f.name)} <span class="count">${counts[f.name]||0}</span></div>`;
    });
    els.folders.innerHTML = html;
    els.folders.querySelectorAll('.chip').forEach(c=>{ c.onclick = ()=>{ activeFolder = c.dataset.folder; render(); }; });
  }

  function renderEntries(){
    const list = state.entries.filter(e => activeFolder==='Все' || e.folder===activeFolder);
    if(list.length===0){
      els.main.innerHTML = `<div class="empty">Пока пусто.<br>Нажмите кнопку записи выше — заметка сама попадёт в нужную папку с конспектом.</div>`;
      return;
    }
    els.main.innerHTML = list.map(e=>{
      const f = getFolder(e.folder);
      const color = f ? f.color : '#87838F';
      if(e.analyzing){
        return `<div class="entry" data-id="${e.id}">
          <div class="entry-title">${escapeHtml(e.title)}</div>
          <div class="analyzing"><span class="spinner"></span> ИИ анализирует запись…</div>
        </div>`;
      }
      return `<div class="entry" data-id="${e.id}">
        <div class="entry-title">${escapeHtml(e.title)}</div>
        <div class="entry-meta">
          <span class="dot" style="background:${color}"></span>
          <span class="folder-name" style="color:${color}">${escapeHtml(e.folder||'')}</span>
          <span class="sep">·</span>
          <span class="time mono">${fmtTime(e.durationSec)} · ${timeAgo(e.createdAt)}</span>
        </div>
        ${e.summary ? `<div class="entry-summary">${escapeHtml(e.summary)}</div>` : ''}
      </div>`;
    }).join('');
    els.main.querySelectorAll('.entry').forEach(el=>{ el.onclick = ()=>openDetail(el.dataset.id); });
  }

  // ---------- Detail sheet ----------
  function openDetail(id){
    const e = state.entries.find(x=>x.id===id);
    if(!e || e.analyzing) return;
    const f = getFolder(e.folder);
    const color = f ? f.color : '#87838F';
    els.sheetContent.innerHTML = `
      <h2>${escapeHtml(e.title)}</h2>
      <div class="meta-row">
        <span class="dot" style="background:${color}"></span>
        <span class="folder-name" style="color:${color}">${escapeHtml(e.folder||'')}</span>
        <span class="sep">·</span>
        <span class="time mono">${fmtTime(e.durationSec)} · ${timeAgo(e.createdAt)}</span>
      </div>
      ${e.audioBase64 ? `<audio controls src="${e.audioBase64}"></audio>` : ''}
      ${e.summary ? `<div class="block-label">Суть</div><div class="summary-text">${escapeHtml(e.summary)}</div>` : ''}
      ${e.keyPoints && e.keyPoints.length ? `<div class="block-label">Конспект</div>
        <ul class="keypoints">${e.keyPoints.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ul>` : ''}
      ${e.conclusion ? `<div class="block-label">Вывод</div><div class="conclusion-text">${escapeHtml(e.conclusion)}</div>` : ''}
      <div class="block-label">Полная расшифровка</div>
      <div class="transcript-text">${escapeHtml(e.transcript || 'Текст не распознан.')}</div>
      <button class="delete-btn" id="deleteEntryBtn">Удалить запись</button>
    `;
    document.getElementById('deleteEntryBtn').onclick = ()=>deleteEntry(id);
    openSheet();
  }

  async function deleteEntry(id){
    state.entries = state.entries.filter(e=>e.id!==id);
    closeSheet(); render(); await saveState();
    showToast('Запись удалена');
  }

  // ---------- Folder manager ----------
  els.manageBtn.onclick = openFolderManager;

  function openFolderManager(){
    renderFolderManager();
    openSheet();
  }

  function renderFolderManager(){
    const rows = state.folders.map(f => `
      <div class="fm-row" data-name="${escapeHtml(f.name)}">
        <button class="fm-dot" style="background:${f.color}" data-action="color"></button>
        <input class="fm-input" value="${escapeHtml(f.name)}" data-action="rename">
        <button class="fm-del" data-action="delete">✕</button>
      </div>
    `).join('');
    els.sheetContent.innerHTML = `
      <h2>Папки</h2>
      <div class="fm-hint">Нажмите на цветной кружок, чтобы сменить цвет. Новые записи ИИ раскладывает по этим папкам сам, по смыслу разговора.</div>
      <div id="fmList" style="margin-top:12px;">${rows || '<div class="fm-hint">Папок пока нет — появятся автоматически после первой записи.</div>'}</div>
    `;
    els.sheetContent.querySelectorAll('.fm-row').forEach(row=>{
      const name = row.dataset.name;
      row.querySelector('[data-action="color"]').onclick = ()=>cycleFolderColor(name);
      row.querySelector('[data-action="rename"]').addEventListener('blur', (ev)=>renameFolder(name, ev.target.value));
      row.querySelector('[data-action="rename"]').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') ev.target.blur(); });
      row.querySelector('[data-action="delete"]').onclick = ()=>deleteFolder(name);
    });
  }

  function cycleFolderColor(name){
    const f = getFolder(name); if(!f) return;
    const idx = PALETTE.indexOf(f.color);
    f.color = PALETTE[(idx+1) % PALETTE.length];
    renderFolderManager(); render(); saveState();
  }

  function renameFolder(oldName, newNameRaw){
    const newName = (newNameRaw||'').trim();
    if(!newName || newName === oldName) { renderFolderManager(); return; }
    if(state.folders.some(f=>f.name.toLowerCase()===newName.toLowerCase() && f.name!==oldName)){
      showToast('Такая папка уже есть');
      renderFolderManager(); return;
    }
    const f = getFolder(oldName); if(!f) return;
    f.name = newName;
    state.entries.forEach(e=>{ if(e.folder===oldName) e.folder = newName; });
    renderFolderManager(); render(); saveState();
  }

  function deleteFolder(name){
    if(!confirm(`Удалить папку «${name}»? Записи из неё переедут в «Разное».`)) return;
    state.folders = state.folders.filter(f=>f.name!==name);
    const fallback = ensureFolder('Разное');
    state.entries.forEach(e=>{ if(e.folder===name) e.folder = fallback.name; });
    renderFolderManager(); render(); saveState();
  }

  // ---------- Sheet helpers ----------
  function openSheet(){ els.overlay.classList.add('open'); els.sheet.classList.add('open'); }
  function closeSheet(){ els.overlay.classList.remove('open'); els.sheet.classList.remove('open'); }
  els.overlay.onclick = closeSheet;

  // ---------- Init ----------
  window.addEventListener('resize', ()=>{ setupCanvas(); if(!isRecording) drawIdle(); });
  setupCanvas();
  drawIdle();
  loadState();
})();
</script>
</body>
</html>
